<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Eden Farm Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-body">
<main class="login">
  <img class="login__logo" src="/assets/img/logo.avif" alt="Eden Farm" width="542" height="168">
  <h1 class="login__title">Staff sign in</h1>
  <form class="login__form" id="login-form" novalidate>
    <p class="alert alert--error" id="login-error" role="alert" hidden></p>
    <div class="f">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="f">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="b b--primary b--block" type="submit" id="login-btn">Sign in</button>
  </form>
  <p class="login__foot">Only for Eden Farm staff. <a href="/">Back to the shop</a></p>
</main>
<script src="/admin/login.js"></script>
</body>
</html>
